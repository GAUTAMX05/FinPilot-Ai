[project]
name = "finpilot-ai"
version = "0.1.0"
description = "FinPilot AI — Financial Digital Twin & Multi-Agent Autonomous Decision Operating System for enterprise finance, invoice auditing, budget governance, and cash forecasting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "razorpay>=1.4.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --ignore=tests/test_browser_interactions.py --ignore=tests/test_copilot_browser.py --ignore=tests/test_compose_request_ui.py"
