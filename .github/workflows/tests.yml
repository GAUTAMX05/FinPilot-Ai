name: FinPilot AI CI - Automated Test Suites

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Reproducible Benchmark Evaluation CLI
        run: python -m src.app.benchmarks.run_controller

      - name: Run Security & Abuse Resistance Test Suite
        run: pytest tests/test_abuse_resistance.py -v

      - name: Run Bulletproof Controller & HITL Test Suite
        run: pytest tests/test_bulletproof_controller_and_hitl.py -v

      - name: Run Autonomous Finance Controller Benchmark Test
        run: python tests/test_finance_controller_benchmark.py

      - name: Run Merchant Commerce & AI Shopping Suite
        run: python tests/test_commerce_and_ai_shopping.py

      - name: Run Digital Twin & Multi-Agent Tests
        run: python tests/test_digital_twin_and_agents.py

      - name: Run Financial Decision Engine Suite
        run: python tests/test_decision_engine_upgrade.py

      - name: Run AI Chat & Reasoning Pipeline
        run: python tests/test_ai_chat_pipeline.py

      - name: Run Data-Backed Endpoints Smoke Test (empty-widget guard)
        run: pytest tests/test_data_backed_endpoints_smoke.py tests/test_copilot_whatif_regression.py -v

      - name: Run Full Pytest Suite
        run: pytest -v
