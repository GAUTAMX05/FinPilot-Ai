services:
  - type: web
    name: finpilot-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_server.py"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPERVISOR_MODEL
        value: gpt-4o-mini
      - key: SUB_AGENT_MODEL
        value: gpt-4o-mini
      - key: LLM_PROVIDER
        value: auto
      - key: HITL_APPROVAL_THRESHOLD_INR
        value: "50000.0"
      - key: AUTONOMOUS_PAYOUT_LIMIT_INR
        value: "10000.0"
      - key: DATABASE_URL
        value: "postgresql://postgres:%40BEKGC3110G@db.eymvupzaiqvhfawunyoa.supabase.co:5432/postgres"
      - key: OPENCODE_API_KEY
        value: "sk-Q3vnm6Gopk1NDw8C8sQraq78DXDENefVcsASnbk9xVcMoaIdVo6On2MECRfTswbK"
      - key: OPENCODE_BASE_URL
        value: "https://opencode.ai/zen/v1"
      - key: CORS_ORIGINS
        value: "*"
